<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Script Builder</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Script Builder</h1>
        <p class="subtitle">Standalone editor voor py3_script_runner scripts.</p>
      </div>
      <div class="file-meta">
        <div>Bestand: <span id="fileLabel">Niet opgeslagen</span></div>
        <div>Status: <span id="saveState">Clean</span></div>
      </div>
    </header>

    <main class="layout">
      <section class="editor-panel">
        <div class="toolbar">
          <button id="btnNew" type="button">Nieuw</button>
          <button id="btnLoad" type="button">Laad</button>
          <button id="btnSave" type="button">Opslaan</button>
          <button id="btnSaveAs" type="button">Opslaan als</button>
        </div>

        <div class="quick-open">
          <span>Quick open:</span>
          <button class="btnQuickOpen" type="button" data-example="example_workshop.json">example_workshop.json</button>
          <button class="btnQuickOpen" type="button" data-example="example_workshop_ppt.json">example_workshop_ppt.json</button>
          <button class="btnQuickOpen" type="button" data-example="example_workshop_summary.json">example_workshop_summary.json</button>
        </div>

        <div class="view-tabs" role="tablist" aria-label="Editor view">
          <button id="btnTabJson" class="tab-btn is-active" type="button">JSON</button>
          <button id="btnTabBlocks" class="tab-btn" type="button">Blocks</button>
        </div>

        <div id="jsonView" class="editor-view">
          <label for="editorJson" class="label">Script JSON</label>
          <textarea id="editorJson" spellcheck="false" autocomplete="off"></textarea>
        </div>

        <div id="blocksView" class="editor-view is-hidden">
          <label for="blocksConfigJson" class="label">Config JSON (robots / ppt / defaults)</label>
          <textarea id="blocksConfigJson" spellcheck="false" autocomplete="off"></textarea>
          <div class="row-actions blocks-config-actions">
            <button id="btnApplyConfig" type="button">Apply config</button>
          </div>
          <div id="blocksConfigError" class="inline-error is-hidden"></div>

          <label class="label">Steps (cards)</label>
          <div id="stepsCards" class="steps-cards"></div>
          <div id="blocksEmpty" class="blocks-empty is-hidden">Geen steps aanwezig. Voeg een template toe.</div>
        </div>
      </section>

      <aside class="builder-panel">
        <div class="builder-main">
          <h2>Add blok</h2>

          <label for="selCategory" class="label">Categorie</label>
          <select id="selCategory"></select>

          <label for="selTemplate" class="label">Template</label>
          <select id="selTemplate"></select>

          <label class="label">Template blocks (bewerkbaar)</label>
          <div id="templateCards" class="template-cards"></div>
          <div id="templateCardsEmpty" class="blocks-empty is-hidden">Geen template steps beschikbaar.</div>

          <div class="row-actions">
            <button id="btnCopyTemplate" type="button">Kopieer template</button>
            <button id="btnInsertTemplate" type="button">Voeg toe aan steps</button>
          </div>
        </div>

        <section class="runtime-panel">
          <h2>Run</h2>
          <div class="row-actions runtime-actions">
            <button id="btnRunStart" type="button">Start</button>
            <button id="btnRunNext" type="button" disabled>Next</button>
            <button id="btnRunAbort" type="button" disabled>Abort</button>
          </div>
          <div class="runtime-meta">
            <div>Status: <span id="runStatus">idle</span></div>
            <div>Progress: <span id="runProgress">0 / 0</span></div>
            <div>Stap: <span id="runStep">-</span></div>
          </div>
          <label for="runLog" class="label">Run log (tail)</label>
          <textarea id="runLog" spellcheck="false" autocomplete="off" readonly></textarea>
        </section>
      </aside>
    </main>

    <footer>
      <div id="statusMessage" class="status status-info">Laden...</div>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
